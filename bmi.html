<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
    }

    .calculator-card {
      background: #111111;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(255, 255, 255, 0.08);
      padding: 32px;
      border: 1px solid #333333;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 26px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      color: #bdbdbd;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #444444;
      background: #1a1a1a;
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 22px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-calculate {
      background-color: #ffffff;
      color: #000000;
    }

    .btn-calculate:hover {
      background-color: #d6d6d6;
    }

    .btn-reset {
      background-color: #262626;
      color: #ffffff;
      border: 1px solid #555555;
    }

    .btn-reset:hover {
      background-color: #333333;
    }

    .result-box {
      display: none;
      background: #1a1a1a;
      border: 1px solid #444444;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .result-box.active {
      display: block;
    }

    .result-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bdbdbd;
      margin-bottom: 6px;
    }

    .bmi-value {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
    }

    .underweight { background-color: #4a3a12; color: #ffd966; }
    .normal      { background-color: #123d25; color: #79df9b; }
    .overweight  { background-color: #4a3212; color: #ffc266; }
    .obese       { background-color: #4a1717; color: #ff8a8a; }

    .reference-section {
      border-top: 1px solid #333333;
      padding-top: 18px;
    }

    .reference-section h2 {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 10px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 10px;
      text-align: left;
    }

    th {
      background-color: #1a1a1a;
      color: #ffffff;
      font-weight: 600;
      border-bottom: 1px solid #444444;
    }

    td {
      border-bottom: 1px solid #333333;
      color: #bdbdbd;
    }

    input::placeholder {
      color: #777777;
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .calculator-card {
        padding: 24px 20px;
      }

      .button-group {
        flex-direction: column;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="calculator-card">
    <header>
      <h1>BMI Calculator</h1>
      <p>Calculate your Body Mass Index & Category</p>
    </header>

    <section>
      <div class="input-group">
        <label for="weightInput">Weight (in kg):</label>
        <input 
          type="number" 
          id="weightInput" 
          placeholder="e.g. 70"
          step="0.1" 
          min="1" 
          max="300"
          required
        >
      </div>

      <div class="input-group">
        <label for="heightInput">Height (in cm):</label>
        <input 
          type="number" 
          id="heightInput" 
          placeholder="e.g. 175"
          step="0.1" 
          min="30" 
          max="250"
          required
        >
      </div>

      <div class="button-group">
        <button type="button" class="btn-calculate" onclick="calculateBMI()">Calculate BMI</button>
        <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
      </div>
    </section>

    <section id="resultBox" class="result-box" aria-live="polite">
      <div class="result-title">Your Calculated BMI</div>
      <div id="bmiValue" class="bmi-value">--</div>
      <div>
        <span id="categoryBadge" class="category-badge">--</span>
      </div>
    </section>

    <section class="reference-section">
      <h2>Standard WHO Categories</h2>
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>BMI Range</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Underweight</td>
            <td>&lt; 18.5</td>
          </tr>
          <tr>
            <td>Normal weight</td>
            <td>18.5 – 24.9</td>
          </tr>
          <tr>
            <td>Overweight</td>
            <td>25.0 – 29.9</td>
          </tr>
          <tr>
            <td>Obese</td>
            <td>&ge; 30.0</td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <script>
    function calculateBMI() {
      const weightValue = document.getElementById('weightInput').value;
      const heightValue = document.getElementById('heightInput').value;

      const weight = parseFloat(weightValue);
      const heightInCm = parseFloat(heightValue);

      if (!Number.isFinite(weight) || !Number.isFinite(heightInCm) || weight <= 0 || heightInCm <= 0) {
        alert("Please enter valid, positive numbers for both Weight and Height.");
        return;
      }

      const heightInMeters = heightInCm / 100;

      const bmi = weight / (heightInMeters * heightInMeters);

      const formattedBMI = bmi.toFixed(1);

      let category = '';
      let badgeClass = '';

      if (bmi < 18.5) {
        category = 'Underweight';
        badgeClass = 'underweight';
      } else if (bmi >= 18.5 && bmi <= 24.9) {
        category = 'Normal Weight';
        badgeClass = 'normal';
      } else if (bmi >= 25.0 && bmi <= 29.9) {
        category = 'Overweight';
        badgeClass = 'overweight';
      } else {
        category = 'Obese';
        badgeClass = 'obese';
      }

      const resultBox = document.getElementById('resultBox');
      const bmiValueElement = document.getElementById('bmiValue');
      const categoryBadgeElement = document.getElementById('categoryBadge');

      bmiValueElement.innerText = formattedBMI;
      categoryBadgeElement.innerText = category;

      categoryBadgeElement.className = 'category-badge ' + badgeClass;

      resultBox.classList.add('active');
    }

    function resetForm() {
      document.getElementById('weightInput').value = '';
      document.getElementById('heightInput').value = '';

      const resultBox = document.getElementById('resultBox');
      document.getElementById('bmiValue').innerText = '--';
      const categoryBadge = document.getElementById('categoryBadge');
      categoryBadge.innerText = '--';
      categoryBadge.className = 'category-badge';
      resultBox.classList.remove('active');
    }
  </script>

</body>
</html>
